org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# The project is on D: and the pub cache is on C:. Kotlin's incremental
# compiler computes relative paths across the two and throws on Windows,
# which takes the whole Gradle daemon down. Slower compile, but it works.
kotlin.incremental=false
# compileSdk 37 is newer than this AGP version's tested maximum; required by permission_handler.
android.suppressUnsupportedCompileSdk=37
